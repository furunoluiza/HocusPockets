[metadata]
name = HocusPockets
version = 1.0.0
author = Machado, L.F.
description = HocusPockets: A Python Package for Identifying and Analyzing Pockets in Protein Structures.
long_description = file: README.md
long_description_content_type = text/markdown
author_email = luizafuruno@ufrj.br
url = https://github.com/furunoluiza/HocusPockets
license = MIT
classifiers =
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.10
    Operating System :: OS Independent

[options]
packages = find:
py_modules = main
python_requires = >=3.8
install_requires =
                    pandas
                    numpy
                    scipy
                    matplotlib


[options.entry_points]
console_scripts =
    hocuspockets = hocuspockets.__main__:main
